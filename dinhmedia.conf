BeautyPlus = type=http-response,pattern=https:\/\/(api\.mr\.pixocial\.com\/v1\/manual_unlock|newbeee-api\.beautyplus\.com\/api\/v1\/asset\/balance),script-path=https://cdn.jsdelivr.net/gh/dinhduyvinh09/AppPre@refs/heads/main/js/BeautyPlus.js,requires-body=true,timeout=60
iTunes = type=http-response,pattern=^https?:\/\/buy\.itunes\.apple\.com\/verifyReceipt$,script-path=https://cdn.jsdelivr.net/gh/dinhduyvinh09/AppPre@refs/heads/main/js/iTunes.js,requires-body=true,timeout=60
Snow = type=http-response,pattern=^https?:\/\/user-snow-api\.snow\.me\/v\d\/purchase\/subscription\/subscriber\/status,script-path=https://cdn.jsdelivr.net/gh/dinhduyvinh09/AppPre@refs/heads/main/js/Snow.js,requires-body=true,timeout=60
Meitu = type=http-response,pattern=^https?:\/\/(h5|api)\.xiuxiu\.meitu\.com\/v\d\/(h\d\/vip|vip|user)\/,requires-body=1,script-path=https://cdn.jsdelivr.net/gh/dinhduyvinh09/AppPre@refs/heads/main/js/MeiTuXiuXiu.js

# --- LOCKET GOLD ĐÌNH MEDIA CHUẨN NẤT ---
dinhmedia_locket_rc = type=http-response,pattern=^https?:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/[^/]+$),script-path=https://cdn.jsdelivr.net/gh/haidinh11550034333-blip/dinhmedia-module@main/dinhmedia.js,requires-body=true,timeout=30
dinhmedia_locket_fb = type=http-response,pattern=^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,script-path=https://cdn.jsdelivr.net/gh/haidinh11550034333-blip/dinhmedia-module@main/dinhmedia.js,requires-body=true,timeout=30

[Map Local]
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad data-type=text data="" status-code=200

[MITM]
hostname = *.googlevideo.com, youtubei.googleapis.com, www.youtube.com, s.youtube.com, -redirector*.googlevideo.com, premium*.truecaller.com, sub.store, api.revenuecat.com, firebaseremoteconfig.googleapis.com, api.rc-backup.com, buy.itunes.apple.com, spclient.wg.spotify.com, *spclient.spotify.com, api-mobile.soundcloud.com, api.picsart.com, us-central1-alight-creative.cloudfunctions.net, api-sub.meitu.com, photos.adobe.io, ap*.intsig.net, api-account.kinemasters.com, api.mr.pixocial.com, newbeee-api.beautyplus.com, user-snow-api.snow.me, h5.xiuxiu.meitu.com, api.xiuxiu.meitu.com
